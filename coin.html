<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoDoggy Coin Details</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a14; color: #e8e8f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        a { color: inherit; }
        .header {
            background: linear-gradient(135deg, #1a0a2e 0%, #0d1a2e 100%);
            border-bottom: 2px solid #f5a623;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-emoji { font-size: 40px; }
        .logo-text h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5a623, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-text p { font-size: 12px; color: #888; margin-top: 3px; }
        .back-link {
            color: #f5a623;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid #3a2a0f;
            border-radius: 999px;
            padding: 9px 14px;
            transition: background 0.15s, border-color 0.15s;
        }
        .back-link:hover, .back-link:focus-visible { background: #201708; border-color: #f5a623; outline: none; }
        .page { max-width: 1100px; margin: 0 auto; padding: 28px 24px 36px; }
        .loading-state, .error-state {
            background: #13132a;
            border: 1px solid #1f1f3a;
            border-radius: 18px;
            padding: 34px;
            text-align: center;
            color: #aaa;
        }
        .error-state h2 { color: #ffca5c; margin-bottom: 10px; }
        .error-state p { margin-bottom: 18px; line-height: 1.5; }
        .error-state a { color: #f5a623; font-weight: 800; }
        .hero {
            background: radial-gradient(circle at top left, rgba(245,166,35,0.18), transparent 36%), #13132a;
            border: 1px solid #242442;
            border-radius: 24px;
            padding: 26px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.22);
        }
        .coin-title { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
        .coin-emoji { font-size: 58px; line-height: 1; }
        .coin-title h2 { font-size: clamp(30px, 5vw, 54px); line-height: 1; }
        .symbol { color: #777; font-size: 15px; font-weight: 800; letter-spacing: 2px; margin-top: 8px; text-transform: uppercase; }
        .price-label { color: #777; font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; }
        .price-value { color: #fff; font-size: clamp(34px, 7vw, 64px); font-weight: 900; margin-top: 5px; }
        .cta-card {
            background: linear-gradient(135deg, #0d2a1a, #1a1a3e);
            border: 1px solid #24523a;
            border-radius: 20px;
            padding: 22px;
        }
        .cta-card h3 { font-size: 22px; margin-bottom: 8px; }
        .cta-card p { color: #b6b6c5; line-height: 1.5; margin-bottom: 18px; }
        .cta-actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .tg-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            transition: transform 0.15s, opacity 0.15s;
        }
        .tg-btn:hover, .tg-btn:focus-visible { transform: translateY(-1px); opacity: 0.92; outline: 2px solid #fff3; outline-offset: 2px; }
        .tg-btn.main { background: #f5a623; color: #0a0a14; }
        .tg-btn.meme { background: #a855f7; color: #fff; }
        .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
        .metric-card { background: #13132a; border: 1px solid #1f1f3a; border-radius: 16px; padding: 16px; }
        .metric-card .label { color: #666; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
        .metric-card .value { font-size: 19px; font-weight: 900; margin-top: 7px; overflow-wrap: anywhere; }
        .green { color: #00d4aa; }
        .red { color: #ff4757; }
        .neutral { color: #888; }
        .chart-card { background: #13132a; border: 1px solid #1f1f3a; border-radius: 20px; padding: 20px; }
        .chart-card h3 { color: #f5a623; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
        .chart-wrap { height: 320px; }
        #sparkline-chart { width: 100%; height: 100%; }
        .meta { color: #444; font-size: 12px; margin-top: 18px; text-align: center; }
        @media (max-width: 820px) {
            .hero { grid-template-columns: 1fr; }
            .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 520px) {
            .header { align-items: flex-start; }
            .metrics { grid-template-columns: 1fr; }
            .page { padding-inline: 16px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html" aria-label="CryptoDoggy homepage">
            <div class="logo-emoji">🐶</div>
            <div class="logo-text">
                <h1>CryptoDoggy Dashboard</h1>
                <p>Coin detail view powered by local price data</p>
            </div>
        </a>
        <a class="back-link" href="index.html">← Back to dashboard</a>
    </header>

    <main class="page" id="app">
        <div class="loading-state">🐶 Loading coin details...</div>
    </main>

    <script>
        let detailChart = null;

        function formatPrice(p) {
            if (p == null) return '—';
            if (p >= 1000) return '$' + p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
            if (p >= 1) return '$' + p.toFixed(2);
            if (p >= 0.01) return '$' + p.toFixed(4);
            if (p >= 0.0001) return '$' + p.toFixed(6);
            return '$' + p.toFixed(8);
        }

        function formatLarge(v) {
            if (!v) return '—';
            if (v >= 1e12) return '$' + (v/1e12).toFixed(2) + 'T';
            if (v >= 1e9) return '$' + (v/1e9).toFixed(1) + 'B';
            if (v >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
            return '$' + v.toLocaleString();
        }

        function changeClass(v) {
            if (v == null) return 'neutral';
            return v >= 0 ? 'green' : 'red';
        }

        function changeText(v) {
            if (v == null) return '—';
            return (v >= 0 ? '+' : '') + Number(v).toFixed(2) + '%';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[char]));
        }

        function renderError(title, message) {
            document.title = 'Coin not found • CryptoDoggy';
            document.getElementById('app').innerHTML = `
                <section class="error-state" role="alert">
                    <h2>${escapeHtml(title)}</h2>
                    <p>${escapeHtml(message)}</p>
                    <a href="index.html">Return to the CryptoDoggy dashboard</a>
                </section>
            `;
        }

        function drawDetailChart(coin) {
            const canvas = document.getElementById('sparkline-chart');
            if (!canvas || !coin.sparkline || coin.sparkline.length === 0) return;
            const color = (coin.change_7d || 0) >= 0 ? '#00d4aa' : '#ff4757';
            if (detailChart) detailChart.destroy();
            detailChart = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: coin.sparkline.map((_, i) => i + 1),
                    datasets: [{
                        data: coin.sparkline,
                        borderColor: color,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: color + '1f',
                        tension: 0.35
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: context => formatPrice(context.parsed.y) } }
                    },
                    scales: {
                        x: { display: false },
                        y: { ticks: { color: '#777', callback: value => formatPrice(value) }, grid: { color: '#23233d' } }
                    }
                }
            });
        }

        function renderCoin(coin, updated) {
            const isMeme = ['dogecoin', 'shiba-inu', 'pepe', 'bonk', 'floki', 'dogwifcoin'].includes(coin.id);
            document.title = `${coin.name} (${coin.symbol}) • CryptoDoggy`;
            document.getElementById('app').innerHTML = `
                <section class="hero">
                    <div>
                        <div class="coin-title">
                            <div class="coin-emoji" aria-hidden="true">${escapeHtml(coin.emoji || '🪙')}</div>
                            <div>
                                <h2>${escapeHtml(coin.name)}</h2>
                                <div class="symbol">${escapeHtml(coin.symbol)}</div>
                            </div>
                        </div>
                        <div class="price-label">Current price</div>
                        <div class="price-value">${formatPrice(coin.price)}</div>
                    </div>
                    <aside class="cta-card" aria-labelledby="telegram-cta-title">
                        <h3 id="telegram-cta-title">Get alerts for moves like this</h3>
                        <p>Join the free CryptoDoggy Telegram channels for market updates, momentum alerts, and meme coin signals.</p>
                        <div class="cta-actions">
                            <a class="tg-btn main" href="https://t.me/CryptoDoggyAlerts" target="_blank" rel="noopener">📈 Major coin alerts</a>
                            <a class="tg-btn meme" href="https://t.me/CryptoDoggyMemes" target="_blank" rel="noopener">🐸 Meme alerts</a>
                        </div>
                    </aside>
                </section>

                <section class="metrics" aria-label="${escapeHtml(coin.name)} market metrics">
                    <div class="metric-card"><div class="label">1h Change</div><div class="value ${changeClass(coin.change_1h)}">${changeText(coin.change_1h)}</div></div>
                    <div class="metric-card"><div class="label">24h Change</div><div class="value ${changeClass(coin.change_24h)}">${changeText(coin.change_24h)}</div></div>
                    <div class="metric-card"><div class="label">7d Change</div><div class="value ${changeClass(coin.change_7d)}">${changeText(coin.change_7d)}</div></div>
                    <div class="metric-card"><div class="label">Market Cap</div><div class="value">${formatLarge(coin.market_cap)}</div></div>
                    <div class="metric-card"><div class="label">24h Volume</div><div class="value">${formatLarge(coin.volume_24h)}</div></div>
                </section>

                <section class="chart-card" aria-label="${escapeHtml(coin.name)} 7-day sparkline chart">
                    <h3>${isMeme ? '🐸' : '📊'} 7-day price sparkline</h3>
                    <div class="chart-wrap"><canvas id="sparkline-chart"></canvas></div>
                </section>
                <p class="meta">Data from prices.json${updated ? ' • Last updated ' + escapeHtml(new Date(updated).toLocaleString()) : ''}</p>
            `;
            drawDetailChart(coin);
        }

        async function loadCoin() {
            const coinId = new URLSearchParams(window.location.search).get('id');
            if (!coinId) {
                renderError('Pick a coin to view', 'No coin ID was provided. Choose a coin from the dashboard to open its detail page.');
                return;
            }

            try {
                const res = await fetch('./prices.json?t=' + Date.now());
                if (!res.ok) throw new Error('Unable to load prices.json.');
                const data = await res.json();
                const coins = [...(data.main_coins || []), ...(data.meme_coins || [])];
                const coin = coins.find(item => item.id === coinId);

                if (!coin) {
                    renderError('Coin not found', `We could not find "${coinId}" in the current CryptoDoggy price list.`);
                    return;
                }

                renderCoin(coin, data.updated);
            } catch (err) {
                console.error(err);
                renderError('Price data unavailable', err.message || 'The coin detail page could not load price data right now.');
            }
        }

        loadCoin();
    </script>
</body>
</html>
