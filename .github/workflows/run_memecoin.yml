name: Memecoin Alert Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-meme-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-meme-

      - run: pip install requests feedparser

      - name: Run memecoin bot
        id: run-meme
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_MEMECOIN_CHAT_ID: ${{ secrets.TELEGRAM_MEMECOIN_CHAT_ID }}
        run: python memecoin_bot.py

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_MEMECOIN_CHAT_ID }}" \
            --data-urlencode "text=🚨 Memecoin Bot FAILED on GitHub Actions. Check the run: https://github.com/${{ github.repository }}/actions"
