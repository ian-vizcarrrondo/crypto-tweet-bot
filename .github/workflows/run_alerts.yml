name: Price Alert Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-alerts:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-alerts-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-alerts-

      - run: pip install requests

      - name: Run alert bot
        id: run-alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MEMECOIN_CHAT_ID: ${{ secrets.TELEGRAM_MEMECOIN_CHAT_ID }}
        run: python alert_bot.py

      - name: Commit cooldown state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cooldown.json || true
          git diff --cached --quiet || git commit -m "Update alert cooldown [skip ci]"
          git push || true

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🚨 Price Alert Bot FAILED on GitHub Actions. Check the run: https://github.com/${{ github.repository }}/actions"
