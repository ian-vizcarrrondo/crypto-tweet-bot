name: Weekly Crypto Digest

on:
  schedule:
    - cron: '0 10 * * 0'   # Every Sunday at 10:00 UTC
  workflow_dispatch:

jobs:
  run-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-weekly-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-weekly-

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run weekly digest bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_bot.py

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🚨 Weekly Digest Bot FAILED. Check: https://github.com/${{ github.repository }}/actions"
