name: Stock Market Daily Digest

on:
  schedule:
    # 4:45 PM ET (Mon–Fri) — 15 min after US market close
    # ET is UTC-4 (EDT summer) / UTC-5 (EST winter)
    # Using UTC-4: 4:45 PM ET = 20:45 UTC (adjust seasonally if needed)
    - cron: '45 20 * * 1-5'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser pytz yfinance

      - name: Run stock bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_bot.py
