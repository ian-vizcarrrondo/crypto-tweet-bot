name: Stock News Alerts (Real-time)

on:
  schedule:
    # Every 30 min, Mon–Fri, during market hours
    # 9:30 AM–5:00 PM ET = 13:30–21:00 UTC (EDT, UTC-4)
    - cron: '0,30 13-21 * * 1-5'
  workflow_dispatch: # manual trigger for testing

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run stock alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_alert_bot.py
